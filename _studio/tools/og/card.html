<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>share card</title>
<!-- 1200x630 share card in the paper style; filled and shot by render.py -->
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;background:#f7f4ed;color:#16202e;font-family:"Segoe UI",system-ui,Arial,sans-serif}
.frame{position:absolute;inset:26px;border:1px solid #d9d3c4}
.art{position:absolute;right:70px;top:50%;width:440px;height:440px;transform:translateY(-50%);display:flex;align-items:center;justify-content:center}
.art svg{display:block}
.copy{position:absolute;left:84px;top:0;bottom:118px;width:600px;display:flex;flex-direction:column;justify-content:center}
.rule{width:56px;height:3px;background:#0b6e7f;margin:0 0 30px}
h1{margin:0;font:400 74px/1.06 "Palatino Linotype",Palatino,Georgia,serif;letter-spacing:-.01em;color:#16202e}
.sub{margin:26px 0 0;font:400 25px/1.45 "Segoe UI",system-ui,Arial,sans-serif;color:#5a6472;max-width:560px}
.foot{position:absolute;left:84px;bottom:66px;display:flex;align-items:center;gap:14px;font:400 18px/1 Consolas,"Cascadia Mono",ui-monospace,monospace;letter-spacing:.02em;color:#5a6472}
.foot svg{display:block}
</style>
</head>
<body>
<div class="frame"></div>
<div class="art" id="art"></div>
<div class="copy">
  <div class="rule"></div>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
</div>
<div class="foot">
  <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#0b6e7f" stroke-width="1.5"><circle cx="12" cy="7.6" r="5.4"/><circle cx="8.2" cy="14.2" r="5.4"/><circle cx="15.8" cy="14.2" r="5.4"/></g></svg>
  <span id="foot"></span>
</div>
</body>
</html>
