<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>share card</title>
<!-- 1200x630 share card in the homepage's language; filled and shot by render.py -->
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{
  position:relative;color:#e6ecff;
  font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  background:
    radial-gradient(70% 90% at 82% 18%, rgba(155,123,255,.22), transparent 62%),
    radial-gradient(60% 70% at 92% 96%, rgba(82,214,230,.14), transparent 60%),
    radial-gradient(50% 60% at 0% 100%, rgba(82,214,230,.08), transparent 60%),
    linear-gradient(180deg,#111a36 0%,#0b1122 46%,#080e1e 100%);
}
body::before{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(rgba(82,214,230,.045) 1px,transparent 1px) 0 0 / 36px 36px,
    linear-gradient(90deg,rgba(82,214,230,.045) 1px,transparent 1px) 0 0 / 36px 36px;
  -webkit-mask-image:radial-gradient(ellipse 60% 80% at 78% 40%,#000,transparent 80%);
}
.art{position:absolute;right:84px;top:50%;transform:translateY(-50%)}
.copy{position:absolute;left:92px;top:0;bottom:0;width:720px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{font:500 19px/1 ui-monospace,"Cascadia Mono",Consolas,monospace;letter-spacing:.3em;text-transform:uppercase;color:#52d6e6;margin:0 0 26px}
h1{margin:0;font:400 84px/1.02 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;letter-spacing:-.02em;color:#f4f7ff}
h1 i{
  background:linear-gradient(90deg,#52d6e6,#9b7bff);-webkit-background-clip:text;background-clip:text;color:transparent;
  padding-right:.08em;
}
.sub{margin:28px 0 0;font:italic 400 32px/1.3 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;color:rgba(230,236,255,.68)}
.foot{position:absolute;left:92px;bottom:64px;display:flex;align-items:center;gap:16px;font:400 17px/1 ui-monospace,"Cascadia Mono",Consolas,monospace;letter-spacing:.24em;text-transform:uppercase;color:rgba(136,145,184,.9)}
</style>
</head>
<body>
<div class="art" id="art"></div>
<div class="copy">
  <p class="eyebrow" id="eyebrow"></p>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
</div>
<div class="foot">
  <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#52d6e6" stroke-width="1.05" opacity=".9"><circle cx="12" cy="7.6" r="5.4"/><circle cx="8.2" cy="14.2" r="5.4"/><circle cx="15.8" cy="14.2" r="5.4"/></g></svg>
  <span id="foot"></span>
</div>
</body>
</html>
