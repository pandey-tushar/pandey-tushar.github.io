<!DOCTYPE html>

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>/* theme before first paint, and drop no-js so nothing stays hidden */
try{var t=localStorage.getItem('qd-theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}catch(e){}
document.documentElement.classList.remove('no-js');</script>
<!-- Google Analytics (GA4). Same property, same config call. gtag.js is 470KB
     and the queue in dataLayer is what the tag replays, so the library waits
     until the page has painted and the main thread is idle. -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-DVPGC1C44Z');
  addEventListener('load', function () {
    var load = function () {
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=G-DVPGC1C44Z';
      document.head.appendChild(s);
    };
    if ('requestIdleCallback' in window) requestIdleCallback(load, { timeout: 3000 });
    else setTimeout(load, 1200);
  });
</script>
